<!--
  Shared template for the two data-export emails
  (api/request-my-data-export.py = student-requested,
   api/admin/email-data-export.py = admin-sent). Same light-UI styling
  and email-client constraints as welcome-email.html - see the notes
  there.

  Tokens: {{NAME}}, {{BODY}}, {{NOTE}}  (BODY/NOTE are plain text,
  HTML-escaped by the caller.)
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#e8eeff" style="background:#e8eeff;">
  <tr>
    <td align="center" style="padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" bgcolor="#ffffff"
             style="width:100%;max-width:480px;background:#ffffff;border:1px solid #c0d0ee;border-radius:20px;">
        <tr>
          <td style="padding:32px 28px 28px;">

            <img src="https://med101.space/email-wordmark.png" width="132" alt="Med101"
                 style="display:block;width:132px;height:auto;border:0;" />
            <div style="font-size:10.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#3d6080;margin-top:6px;">
              Learn. Practice. Improve.
            </div>

            <div style="height:1px;background:#c0d0ee;margin:22px 0 24px;line-height:1px;font-size:1px;">&nbsp;</div>

            <h1 style="color:#081428;font-size:22px;line-height:1.3;margin:0 0 12px;">Your Med101 data export</h1>

            <p style="color:#1e3a5c;font-size:14.5px;line-height:1.65;margin:0 0 6px;">Hi {{NAME}},</p>
            <p style="color:#1e3a5c;font-size:14.5px;line-height:1.65;margin:0 0 22px;">{{BODY}}</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f0f4ff"
                   style="background:#f0f4ff;border:1px solid #c0d0ee;border-radius:14px;margin-bottom:22px;">
              <tr>
                <td style="padding:14px 18px;">
                  <div style="color:#0090c8;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;">
                    📎 Attached
                  </div>
                  <div style="color:#1e3a5c;font-size:13.5px;line-height:1.6;">
                    med101-data-export.pdf
                  </div>
                </td>
              </tr>
            </table>

            <p style="color:#3d6080;font-size:12.5px;line-height:1.65;margin:0;border-top:1px solid #c0d0ee;padding-top:16px;">
              {{NOTE}}
              <br/>
              Questions? Reply to this email, or write to
              <a href="mailto:admin.med101@gmail.com" style="color:#0090c8;text-decoration:none;">admin.med101@gmail.com</a>.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
