<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Med101" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med101 - Learn. Practice. Improve.</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Pure HTML/CSS placeholder, zero JS/fonts/network required - shows
         the instant the browser paints, before the app bundle has even
         finished downloading. Matters most on slow connections, where
         the JS bundle can take many seconds to arrive and there would
         otherwise be nothing on screen at all until it does. React
         replaces this entirely the moment it mounts into #root.

         Kept pixel-for-pixel in sync with .app-loading-screen and its
         children in src/styles/tokens.css (colors, gradient, tagline,
         play icon + indeterminate bar) on purpose: this placeholder was
         previously a simpler, differently-colored design (plain
         centered logo + spinner, old navy background), so swapping to
         the real loader was a visible flash of two different-looking
         screens rather than one continuous one. If the real loader's
         look changes, update both places. */
      html, body { background: #050505; margin: 0; }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050505;
        padding: 20px;
      }
      #initial-loader .logo-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      #initial-loader .logo {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 2.4rem;
        line-height: 1;
        background: linear-gradient(90deg, #1e3a5f, #3d5875, #64748b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #initial-loader .tagline {
        margin-top: 6px;
        font-family: 'Inter', 'Space Grotesk', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8aaed0;
        text-align: left;
      }
      #initial-loader .bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 220px;
      }
      #initial-loader .play {
        color: #4a6f94;
        font-size: 15px;
        flex-shrink: 0;
      }
      #initial-loader .track {
        flex: 1;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #initial-loader .fill {
        position: relative;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1e3a5f, #3d5875);
        animation: initial-sweep 1.3s ease-in-out infinite;
      }
      @keyframes initial-sweep {
        0% { margin-left: -40%; width: 40%; }
        50% { width: 60%; }
        100% { margin-left: 100%; width: 40%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .fill { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader">
      <div class="logo-stack">
        <div class="logo">Med101</div>
        <div class="tagline">Learn. Practice. Improve.</div>
      </div>
      <div class="bar-row">
        <span class="play">▶</span>
        <div class="track"><div class="fill"></div></div>
      </div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
