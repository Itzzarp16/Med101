<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e9edf3" />
    <script>
      /* Apply the saved theme before first paint (light is the default), so the
         placeholder loader and the browser bar already match the real app. */
      try {
        var dark = localStorage.getItem('med101_theme') === 'dark';
        if (!dark) document.documentElement.classList.add('light-mode');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#050505' : '#e9edf3');
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/Syne-ExtraBold.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Med101" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med101 - Learn. Practice. Improve.</title>
    <meta name="description" content="Medical exam prep: Physiology, Biochemistry, Anatomy, and more." />

    <!-- Link previews (WhatsApp, Telegram, Facebook, LinkedIn, X, iMessage...).
         Crawlers don't run JavaScript, so these have to live in the static
         HTML. The image is public/og-image.png (1200x630); chat apps cache
         previews, so if you replace it, rename the file and update the two
         image URLs below. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Med101" />
    <meta property="og:title" content="Med101 - Learn. Practice. Improve." />
    <meta property="og:description" content="Medical exam prep: Physiology, Biochemistry, Anatomy, and more." />
    <meta property="og:url" content="https://med101.space/" />
    <meta property="og:image" content="https://med101.space/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Med101 - Learn. Practice. Improve." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Med101 - Learn. Practice. Improve." />
    <meta name="twitter:description" content="Medical exam prep: Physiology, Biochemistry, Anatomy, and more." />
    <meta name="twitter:image" content="https://med101.space/og-image.png" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Pure HTML/CSS placeholder, zero JS/fonts/network required - shows
         the instant the browser paints, before the app bundle has even
         finished downloading. Matters most on slow connections, where
         the JS bundle can take many seconds to arrive and there would
         otherwise be nothing on screen at all until it does. React
         replaces this entirely the moment it mounts into #root.

         Kept pixel-for-pixel in sync with .app-loading-screen and its
         children in src/styles/tokens.css (colors, gradient, tagline,
         play icon + indeterminate bar) on purpose: this placeholder was
         previously a simpler, differently-colored design (plain
         centered logo + spinner, old navy background), so swapping to
         the real loader was a visible flash of two different-looking
         screens rather than one continuous one. If the real loader's
         look changes, update both places. */
      html, body { background: #050505; margin: 0; }
      html.light-mode, html.light-mode body { background: #e9edf3; }
      /* Same Syne file the intro film embeds, so the loading wordmark and
         the film's wordmark are drawn with identical glyphs from the very
         first paint (the Google Fonts copy can arrive late or not at all). */
      @font-face { font-family: 'Syne'; font-weight: 800; font-display: block; src: url('/fonts/Syne-ExtraBold.ttf') format('truetype'); }
      #initial-loader {
        /* One lockup size for this placeholder, the React loader AND the intro
           film (public/intro.html uses this exact clamp). */
        --lockup-fs: clamp(38px, 12.5vw, 96px);
        --il-cyan: #4a6f94; --il-cyan-rgb: 74, 111, 148; --il-violet-rgb: 107, 111, 138; --il-text3: #8aaed0;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #050505;
        padding: 20px;
        z-index: 1000;
        overflow: hidden;
      }
      html.light-mode #initial-loader {
        background: #e9edf3;
        --il-cyan: #3d5c7d; --il-cyan-rgb: 61, 92, 125; --il-violet-rgb: 91, 95, 125; --il-text3: #4f647c;
      }
      /* Same soft glow backdrop as .app-loading-screen::before and the film's .bg. */
      #initial-loader::before {
        content: '';
        position: absolute;
        inset: -10%;
        pointer-events: none;
        background:
          radial-gradient(40% 30% at 20% 22%, rgba(var(--il-cyan-rgb), 0.2), transparent 70%),
          radial-gradient(34% 28% at 82% 68%, rgba(var(--il-cyan-rgb), 0.14), transparent 70%),
          radial-gradient(60% 40% at 50% 102%, rgba(var(--il-violet-rgb), 0.2), transparent 70%);
        animation: initial-drift 14s ease-in-out infinite alternate;
      }
      html.light-mode #initial-loader::before { display: none; }
      @keyframes initial-drift { to { transform: translate3d(2%, -2%, 0) scale(1.06); } }
      #initial-loader .logo-stack {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
        /* same wordmark centring offset as .app-loading-logo-stack */
        margin-right: calc(var(--lockup-fs) * 0.152);
      }
      #initial-loader .logo {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: var(--lockup-fs);
        line-height: 1;
        background: linear-gradient(180deg, #f4f8ff 0%, #a9c8f0 55%, #6f93bd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 22px rgba(106, 168, 255, 0.35));
      }
      html.light-mode #initial-loader .logo {
        filter: drop-shadow(0.9px 0 0 #1e3a5f) drop-shadow(-0.9px 0 0 #1e3a5f) drop-shadow(0 0.9px 0 #1e3a5f)
          drop-shadow(0 -0.9px 0 #1e3a5f) drop-shadow(0 3px 4px rgba(12, 28, 48, 0.35));
      }
      #initial-loader .tagline {
        margin-top: 0.05em;
        font-family: 'Inter', 'Space Grotesk', sans-serif;
        font-size: calc(var(--lockup-fs) * 8 / 19);
        white-space: nowrap;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--il-text3);
        text-align: left;
      }
      /* Out of flow, like .app-loading-below, so the lockup is always centred
         exactly where the film puts it. */
      #initial-loader .below {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        top: calc(50% + var(--lockup-fs) * 0.72 + 22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px;
      }
      #initial-loader .bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 220px;
      }
      #initial-loader .play {
        color: var(--il-cyan);
        font-size: 15px;
        flex-shrink: 0;
      }
      #initial-loader .track {
        flex: 1;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      html.light-mode #initial-loader .track { background: rgba(30, 58, 95, 0.12); }
      #initial-loader .fill {
        position: relative;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1e3a5f, #3d5875, #64748b);
        animation: initial-sweep 1.3s ease-in-out infinite;
      }
      @keyframes initial-sweep {
        0% { margin-left: -40%; width: 40%; }
        50% { width: 60%; }
        100% { margin-left: 100%; width: 40%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .fill, #initial-loader::before { animation: none; }
      }
      /* Shown only if the app still hasn't started after a long time. */
      #initial-loader .stuck { display: none; margin-top: 4px; text-align: center; color: #8aa0b8; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      #initial-loader .stuck button { margin-top: 12px; padding: 9px 16px; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; background: rgba(255,255,255,0.08); color: #dbe6f3; border: 1px solid rgba(255,255,255,0.18); }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader">
      <div class="logo-stack">
        <div class="logo">Med101</div>
        <div class="tagline">Learn. Practice. Improve.</div>
      </div>
      <div class="below">
        <div class="bar-row">
          <span class="play">▶</span>
          <div class="track"><div class="fill"></div></div>
        </div>
        <div class="stuck" id="initial-stuck">
          <div>The app didn't start. Check your connection.</div>
          <button onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div></div>
    <script>
      /* Tagline exactly as wide as the wordmark (same edges). Mirrors
         src/lib/lockup.js for the pre-React splash. */
      (function () {
        function fit() {
          var box = document.querySelector('#initial-loader .logo-stack');
          if (!box) return;
          var mark = box.querySelector('.logo'), tag = box.querySelector('.tagline');
          function w(el) { var r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }
          tag.style.letterSpacing = '0px';
          var ls = (w(mark) - w(tag)) / (tag.textContent.length - 1);
          if (isFinite(ls)) tag.style.letterSpacing = ls.toFixed(3) + 'px';
        }
        document.addEventListener('DOMContentLoaded', fit);
        if (document.fonts) {
          document.fonts.ready.then(fit);
          document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', fit);
        }
        window.addEventListener('resize', fit);
        fit();
      })();
    </script>
    <script>
      /* React replaces #initial-loader the moment it mounts. If it is still
         here after 15s, the app's code failed to load or start - offer a
         reload instead of an endless bar. */
      setTimeout(function () {
        var l = document.getElementById('initial-loader');
        var s = document.getElementById('initial-stuck');
        if (l && s) s.style.display = 'block';
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
