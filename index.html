<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MED101 — Temporarily Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060818;
    --bg2:#0a0f22;
    --cyan:#18e8ff;
    --cyan2:#00ccee;
    --violet:#7c5cff;
    --pink:#ff5cb3;
    --text:#e8ecf7;
    --muted:#8b91ab;
    --line:rgba(24,232,255,0.16);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.18), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(24,232,255,0.14), transparent 45%);
    pointer-events:none;
  }

  .card{
    max-width:540px;
    width:100%;
    background:var(--bg2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:44px 38px;
    position:relative;
    z-index:1;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }

  .brand{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:0.04em;
    background:linear-gradient(135deg,var(--cyan) 0%,var(--violet) 60%,var(--pink) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin-bottom:28px;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--cyan);
    font-weight:600;
    margin-bottom:20px;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.3;}
  }

  h1{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:1.7rem;
    line-height:1.35;
    margin-bottom:18px;
    color:#fff;
  }

  p{
    font-size:15px;
    line-height:1.7;
    color:var(--muted);
    margin-bottom:14px;
  }

  .signoff{
    margin-top:30px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-size:14px;
    color:var(--text);
  }

  .signoff .thanks{
    font-weight:600;
    margin-bottom:10px;
  }

  .signoff .sig{
    font-family:'Syne',sans-serif;
    font-weight:700;
    color:var(--cyan);
  }

  @media (prefers-reduced-motion: reduce){
    .dot{animation:none;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">MED101</div>
    <div class="eyebrow"><span class="dot"></span>Service Update</div>
    <h1>We're experiencing more users than expected.</h1>
    <p>
      We're working to resolve this as quickly as possible.
    </p>
    <p>
      We'll be back soon.
    </p>
    <div class="signoff">
      <div class="thanks">Thank you for your support.</div>
      <div class="sig">~ Abhishek Verma</div>
    </div>
  </div>
</body>
</html>
