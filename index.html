<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060818" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Med101" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Med101 - Physiology, Biochemistry, Anatomy, Kyrgyz, MSCR</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Pure HTML/CSS placeholder, zero JS/fonts/network required - shows
         the instant the browser paints, before the app bundle has even
         finished downloading. Matters most on slow connections, where
         the JS bundle can take many seconds to arrive and there would
         otherwise be nothing on screen at all until it does. React
         replaces this entirely the moment it mounts into #root. */
      html, body { background: #060818; margin: 0; }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #060818;
      }
      #initial-loader .logo {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 2.2rem;
        background: linear-gradient(90deg, #00e5ff, #a78bfa, #ff4f6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #initial-loader .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #00e5ff;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader"><div class="logo">Med101</div><div class="spinner"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
