        ];

        let processedQuestions = [];
        let score = 0;
        let answeredCount = 0;

        // Fisher-Yates shuffle algorithm to mix up options
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Initialize database and shuffle all options
        function loadQuiz() {
            processedQuestions = rawDatabase.map(item => {
                const num = item[0];
                const text = item[1];
                const originalOptions = item[2];
                const correctText = originalOptions[0]; // The first index holds the correct answer

                // Create a shallow copy and shuffle the options
                const shuffledOptions = shuffle([...originalOptions]);
                
                return {
                    num: num,
                    text: text,
                    options: shuffledOptions,
                    correct: correctText,
                    userAnswer: null
                };
            });

            score = 0;
            answeredCount = 0;
            updateScoreDisplay();
            renderQuiz();
        }

        // Update top navigation counter
        function updateScoreDisplay() {
            document.getElementById('score-display').textContent = `${score} / ${processedQuestions.length}`;
        }

        // Render entire database of questions dynamically
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            processedQuestions.forEach((q, qIndex) => {
                const qCard = document.createElement('div');
                qCard.className = "bg-white p-5 sm:p-6 rounded-xl shadow-sm border border-slate-100 space-y-4";
                qCard.id = `question-card-${qIndex}`;

                // Question Label
                const qTitle = document.createElement('h3');
                qTitle.className = "font-bold text-slate-900 text-base sm:text-lg leading-relaxed";
                qTitle.textContent = `${q.num}. ${q.text}`;
                qCard.appendChild(qTitle);

                // Option Grid
                const optionsGrid = document.createElement('div');
                optionsGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

                q.options.forEach((opt, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn w-full text-left px-4 py-3 border border-slate-200 hover:border-teal-500 hover:bg-teal-50/30 rounded-lg text-slate-700 font-medium text-sm flex items-start gap-3";
                    btn.id = `btn-${qIndex}-${optIndex}`;
                    btn.onclick = () => selectOption(qIndex, optIndex, opt);

                    // Add Cyrllic tags (а, б, в, г) to the option elements
                    const tagLetters = ["а", "б", "в", "г"];
                    const label = tagLetters[optIndex] || "-";

                    const marker = document.createElement('span');
                    marker.className = "inline-flex items-center justify-center w-5 h-5 rounded bg-slate-100 text-slate-500 font-bold text-xs shrink-0 mt-0.5";
                    marker.textContent = label;

                    const textSpan = document.createElement('span');
                    textSpan.className = "leading-normal";
                    textSpan.textContent = opt;

                    btn.appendChild(marker);
                    btn.appendChild(textSpan);
                    optionsGrid.appendChild(btn);
                });

                qCard.appendChild(optionsGrid);
                container.appendChild(qCard);
            });
        }

        // Handle user clicks on options
        function selectOption(qIndex, optIndex, selectedText) {
            const q = processedQuestions[qIndex];
            if (q.userAnswer !== null) return; // Prevent changing responses

            q.userAnswer = selectedText;
            answeredCount++;

            const isCorrect = (selectedText === q.correct);
            if (isCorrect) {
                score++;
            }

            updateScoreDisplay();
            highlightQuestionAnswers(qIndex, optIndex, isCorrect);
        }

        // Highlight selection results visually
        function highlightQuestionAnswers(qIndex, selectedOptIndex, isCorrect) {
            const q = processedQuestions[qIndex];
            
            q.options.forEach((opt, optIndex) => {
                const btn = document.getElementById(`btn-${qIndex}-${optIndex}`);
                btn.disabled = true;

                if (opt === q.correct) {
                    btn.classList.remove('border-slate-200', 'hover:border-teal-500', 'hover:bg-teal-50/30');
                    btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                    btn.querySelector('span').classList.add('bg-green-500', 'text-white');
                    btn.querySelector('span').classList.remove('bg-slate-100', 'text-slate-500');
                } else if (optIndex === selectedOptIndex && !isCorrect) {
                    btn.classList.remove('border-slate-200', 'hover:border-teal-500', 'hover:bg-teal-50/30');
                    btn.classList.add('border-red-500', 'bg-red-50', 'text-red-800');
                    btn.querySelector('span').classList.add('bg-red-500', 'text-white');
                    btn.querySelector('span').classList.remove('bg-slate-100', 'text-slate-500');
                } else {
                    btn.classList.add('opacity-50');
                }
            });
        }

        // Automatically reveal all correct answers on request
        function showAllAnswers() {
            processedQuestions.forEach((q, qIndex) => {
                if (q.userAnswer === null) {
                    q.userAnswer = q.correct;
                    q.options.forEach((opt, optIndex) => {
                        const btn = document.getElementById(`btn-${qIndex}-${optIndex}`);
                        btn.disabled = true;
                        if (opt === q.correct) {
                            btn.classList.remove('border-slate-200');
                            btn.classList.add('border-green-500', 'bg-green-50', 'text-green-800');
                            btn.querySelector('span').classList.add('bg-green-500', 'text-white');
                            btn.querySelector('span').classList.remove('bg-slate-100', 'text-slate-500');
                        } else {
                            btn.classList.add('opacity-50');
                        }
                    });
                }
            });
        }

        // Reset quiz and shuffle again
        function resetQuiz() {
            if (confirm("Чын эле тестти кайрадан баштап, варианттарды жаңыдан аралаштыргыңыз келеби?")) {
                loadQuiz();
            }
        }

        // Run setup on load
        window.onload = loadQuiz;
    </script>
</body>
</html>
